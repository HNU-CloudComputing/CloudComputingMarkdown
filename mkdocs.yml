site_name: 云计算原理与实践：以在线游戏为载体
site_description: 《云计算原理与实践：以在线游戏为载体》在线阅读版

theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/school
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - footnotes
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/course.css?v=20260830-codeblocks

